<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Overlay Objectif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brg-deep: #012B18;
    --brg: #01532B;
    --brg-bright: #2E9A5C;
    --mint: #BFE3CE;
    --ink: #08090A;
    --track: #17201B;
    --paper: #F3F5F1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    font-family: 'Barlow Condensed', sans-serif;
    padding: 20px;
  }
  .box {
    background: var(--ink);
    border: 1px solid rgba(46, 154, 92, 0.35);
    border-radius: 12px;
    padding: 18px 22px;
    width: 420px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .label {
    font-size: 20px;
    font-weight: 600;
    color: var(--paper);
  }
  .count {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    color: var(--mint);
  }
  .track {
    width: 100%;
    height: 14px;
    background: var(--track);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--brg-deep), var(--brg-bright));
    border-radius: 8px;
    transition: width 0.6s ease;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="top">
      <span class="label" id="goalLabel">Objectif</span>
      <span class="count" id="goalCount">0/0</span>
    </div>
    <div class="track"><div class="fill" id="goalFill" style="width:0%"></div></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const labelEl = document.getElementById('goalLabel');
    const countEl = document.getElementById('goalCount');
    const fillEl = document.getElementById('goalFill');

    function render(goal) {
      labelEl.textContent = goal.label;
      countEl.textContent = `${goal.current}/${goal.target}`;
      const pct = Math.min(100, Math.round((goal.current / goal.target) * 100));
      fillEl.style.width = `${pct}%`;
    }

    fetch('/public-api/longtermgoal')
      .then((res) => res.json())
      .then(render)
      .catch(() => {});

    socket.on('longtermgoal:update', render);
  </script>
</body>
</html>
