<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Overlay Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brg-deep: #012B18;
    --brg: #01532B;
    --brg-bright: #2E9A5C;
    --mint: #BFE3CE;
    --ink: #08090A;
    --paper: #F3F1E7;
    --caption-dark: #1A1A18;
    --caption-muted: #8A8A82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    font-family: 'Barlow Condensed', sans-serif;
    padding: 30px;
  }

  .polaroid {
    position: relative;
    width: 208px;
    background: var(--paper);
    padding: 12px 12px 0 12px;
    border-radius: 3px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3);
    transform: rotate(-4deg) translateY(16px);
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .polaroid.show { opacity: 1; transform: rotate(-4deg) translateY(0); }

  /* Petit bout de "scotch" en haut, clin d'œil BRG */
  .tape {
    position: absolute;
    top: -10px;
    left: 50%;
    width: 64px;
    height: 22px;
    transform: translateX(-50%) rotate(2deg);
    background: linear-gradient(180deg, rgba(191,227,206,0.55), rgba(191,227,206,0.3));
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  .art-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background-color: var(--brg-deep);
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }

  .eq-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    background: rgba(1, 43, 24, 0.65);
    padding: 5px 6px;
    border-radius: 4px;
    backdrop-filter: blur(2px);
  }
  .eq-badge span {
    width: 3px;
    background: var(--brg-bright);
    border-radius: 1px;
    animation: eq 0.9s ease-in-out infinite;
  }
  .eq-badge span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .eq-badge span:nth-child(2) { height: 11px; animation-delay: 0.2s; }
  .eq-badge span:nth-child(3) { height: 8px; animation-delay: 0.4s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

  .caption {
    padding: 14px 4px 20px;
  }
  .title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--caption-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .artist {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--caption-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="polaroid" id="polaroid">
    <div class="tape"></div>
    <div class="art-frame" id="art">
      <div class="eq-badge"><span></span><span></span><span></span></div>
    </div>
    <div class="caption">
      <p class="title" id="title">—</p>
      <p class="artist" id="artist">—</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const polaroid = document.getElementById('polaroid');
    const art = document.getElementById('art');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');

    function render(data) {
      if (!data || !data.isPlaying) {
        polaroid.classList.remove('show');
        return;
      }
      titleEl.textContent = data.title || '—';
      artistEl.textContent = data.artist || '—';
      if (data.albumArt) art.style.backgroundImage = `url(${data.albumArt})`;
      polaroid.classList.add('show');
    }

    fetch('/public-api/nowplaying')
      .then((res) => res.json())
      .then(render)
      .catch(() => {});

    socket.on('nowplaying:update', render);
  </script>
</body>
</html>
