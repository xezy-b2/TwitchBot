<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Overlay Alertes</title>
<style>
  body {
    margin: 0;
    background: transparent;
    font-family: 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  #alertBox {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    opacity: 0;
    transition: all 0.4s cubic-bezier(.34,1.56,.64,1);
    background: linear-gradient(135deg, #9146FF, #6a1fd0);
    color: white;
    padding: 24px 48px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #alertBox.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  #alertBox .icon { font-size: 48px; }
  #alertBox .text { font-size: 26px; font-weight: bold; margin-top: 8px; }
</style>
</head>
<body>
  <div id="alertBox">
    <div class="icon" id="alertIcon">🎉</div>
    <div class="text" id="alertText"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const box = document.getElementById('alertBox');
    const iconEl = document.getElementById('alertIcon');
    const textEl = document.getElementById('alertText');

    const icons = { follow: '🎉', sub: '⭐', resub: '⭐', giftsub: '🎁', cheer: '💎' };
    const audio = new Audio(); // ajoute ton propre son ici si besoin, ex: audio.src = '/overlay/sounds/alert.mp3'

    let queue = [];
    let showing = false;

    socket.on('alert', (data) => {
      queue.push(data);
      processQueue();
    });

    function processQueue() {
      if (showing || queue.length === 0) return;
      showing = true;
      const data = queue.shift();

      let text = '';
      if (data.type === 'follow') text = `${data.user} vient de follow !`;
      else if (data.type === 'sub') text = `${data.user} s'est abonné (Tier ${data.tier}) !`;
      else if (data.type === 'resub') text = `${data.user} est abonné depuis ${data.months} mois !`;
      else if (data.type === 'giftsub') text = `${data.user} a offert ${data.total} sub(s) !`;
      else if (data.type === 'cheer') text = `${data.user} a envoyé ${data.bits} bits !`;

      iconEl.textContent = icons[data.type] || '🎉';
      textEl.textContent = text;
      box.classList.add('show');

      // Son (activer l'audio dans les propriétés de la source OBS)
      // if (audio.src) audio.play().catch(() => {});

      setTimeout(() => {
        box.classList.remove('show');
        showing = false;
        setTimeout(processQueue, 400);
      }, 5000);
    }
  </script>
</body>
</html>
