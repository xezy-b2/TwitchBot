<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Overlay Succès Steam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brg-deep: #012B18;
    --brg: #01532B;
    --brg-bright: #2E9A5C;
    --mint: #BFE3CE;
    --ink: #08090A;
    --track: rgba(255,255,255,0.12);
    --paper: #F3F5F1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    font-family: 'Barlow Condensed', sans-serif;
    padding: 20px;
  }
  .box {
    position: relative;
    background-color: var(--ink);
    background-size: cover;
    background-position: right center;
    border: 1px solid rgba(46, 154, 92, 0.35);
    border-radius: 14px;
    padding: 16px 20px;
    width: 360px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.4s ease;
    overflow: hidden;
  }
  .box.show { opacity: 1; transform: translateY(0); }

  /* Voile sombre en dégradé : opaque à gauche (texte), l'image du jeu respire à droite */
  .box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(8,9,10,0.94) 0%, rgba(8,9,10,0.75) 55%, rgba(8,9,10,0.25) 100%);
    pointer-events: none;
  }
  .box > * { position: relative; z-index: 1; }

  .title {
    font-size: 21px;
    font-weight: 700;
    color: var(--paper);
    line-height: 1.15;
    margin: 0 0 8px;
  }

  .stats-line {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--paper);
    margin: 0 0 8px;
  }
  .stats-line .pct {
    color: var(--brg-bright);
    text-shadow: 0 0 10px rgba(46, 154, 92, 0.5);
  }

  .track {
    width: 100%;
    height: 6px;
    background: var(--track);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .fill {
    height: 100%;
    background: var(--brg-bright);
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  .playtime {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--mint);
  }

  /* --- Toast animé "succès débloqué" (temporaire, distinct de la carte permanente) --- */
  .toast {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--ink);
    border: 2px solid var(--brg-bright);
    border-radius: 12px;
    padding: 12px 22px 12px 16px;
    width: fit-content;
    max-width: 340px;
    margin-bottom: 14px;
    box-shadow: 0 0 0 1px rgba(46, 154, 92, 0.25), 0 16px 36px rgba(0,0,0,0.55);
    opacity: 0;
    transform: translateY(-16px) scale(0.92);
    transition: all 0.45s cubic-bezier(.34,1.56,.64,1);
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .toast-icon {
    font-size: 30px;
    line-height: 1;
    filter: drop-shadow(0 0 10px rgba(46, 154, 92, 0.6));
    animation: trophyPop 0.6s ease;
  }
  @keyframes trophyPop {
    0% { transform: scale(0.4) rotate(-15deg); }
    60% { transform: scale(1.15) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .toast-eyebrow {
    margin: 0 0 2px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brg-bright);
  }
  .toast-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--paper);
    line-height: 1.2;
  }
  .toast-text .highlight {
    font-family: 'Space Mono', monospace;
    color: var(--brg-bright);
  }
</style>
</head>
<body>
  <div class="toast" id="toast">
    <div class="toast-icon">🏆</div>
    <div>
      <p class="toast-eyebrow">Succès débloqué</p>
      <p class="toast-text" id="toastText">—</p>
    </div>
  </div>

  <div class="box" id="box">
    <p class="title" id="gameName">—</p>
    <p class="stats-line" id="statsLine">0 / 0 succès · <span class="pct">0%</span></p>
    <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
    <p class="playtime" id="playtime"></p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const box = document.getElementById('box');
    const gameNameEl = document.getElementById('gameName');
    const statsLineEl = document.getElementById('statsLine');
    const fillEl = document.getElementById('fill');
    const playtimeEl = document.getElementById('playtime');

    function formatPlaytime(minutes) {
      if (!minutes) return 'Pas encore commencé';
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return h > 0 ? `${h}h ${m.toString().padStart(2, '0')}min jouées` : `${m}min jouées`;
    }

    function render(state) {
      if (!state || !state.hasAchievements) {
        box.classList.remove('show');
        return;
      }
      gameNameEl.textContent = state.steamGameName || state.twitchCategoryName || '—';
      const pct = state.total > 0 ? Math.min(100, Math.round((state.unlocked / state.total) * 100)) : 0;
      statsLineEl.innerHTML = `${state.unlocked} / ${state.total} succès · <span class="pct">${pct}%</span>`;
      fillEl.style.width = `${pct}%`;
      playtimeEl.textContent = formatPlaytime(state.playtimeMinutes);
      box.style.backgroundImage = state.steamAppId
        ? `url(https://cdn.cloudflare.steamstatic.com/steam/apps/${state.steamAppId}/header.jpg)`
        : 'none';
      box.classList.add('show');
    }

    fetch('/public-api/achievements')
      .then((res) => res.json())
      .then(render)
      .catch(() => {});

    socket.on('achievements:update', render);

    // --- Toast "succès débloqué" (animation temporaire) ---
    const toast = document.getElementById('toast');
    const toastTextEl = document.getElementById('toastText');
    let toastTimeout;

    socket.on('achievement:unlocked', (data) => {
      toastTextEl.innerHTML = `<span class="highlight">${data.unlocked}/${data.total}</span> sur ${data.gameName || 'ce jeu'} !`;
      toast.classList.add('show');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 6000);
    });
  </script>
</body>
</html>
