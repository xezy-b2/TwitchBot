<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — AMBRI.BOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/css/app.css" />
</head>
<body class="login-body">

  <section class="login-hero">
    <img class="hero-logo" src="/dashboard/img/logo-ab.png" alt="" />
    <p class="hero-status"><span class="dot"></span> Le bot est en ligne</p>
    <h1 class="hero-title">AMBRI.BOT</h1>
    <p class="hero-tagline">Ton chat, tes alertes et ton subathon, réunis au même endroit.</p>
    <ul class="hero-features">
      <li>Commandes</li>
      <li>Alertes en direct</li>
      <li>Subathon</li>
      <li>Overlays OBS</li>
    </ul>
  </section>

  <section class="login-panel">
    <div class="login-box">
      <h2>Bienvenue</h2>
      <p class="hint">Entre ton mot de passe pour ouvrir le dashboard.</p>
      <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" />
      <button id="loginBtn">Entrer</button>
      <p id="error" class="error"></p>
    </div>
  </section>

  <script>
    async function tryLogin() {
      const password = document.getElementById('password').value;
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = '/dashboard';
      } else {
        document.getElementById('error').textContent = data.error || 'Erreur de connexion';
      }
    }
    document.getElementById('loginBtn').addEventListener('click', tryLogin);
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryLogin();
    });
  </script>
</body>
</html>
